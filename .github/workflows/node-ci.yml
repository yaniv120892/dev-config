name: Node quality gate

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '22'
      audit:
        description: Fail on critical advisories in production dependencies.
        type: boolean
        default: false
      build-node-options:
        description: NODE_OPTIONS for the build step, e.g. --max-old-space-size=4096.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - if: inputs.audit
        run: npm audit --omit=dev --audit-level=critical
      - run: npm run format:check
      - run: npm run lint
      # --if-present: a plain-JS repo has no typecheck, a service may have no build.
      - run: npm run typecheck --if-present
      - run: npm test
      - run: npm run build --if-present
        env:
          NODE_OPTIONS: ${{ inputs.build-node-options }}
